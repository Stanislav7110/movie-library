<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Фильм — Моя Кинотека</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #f2f3f5;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(70, 82, 105, 0.18),
          transparent 45%
        ),
        #101216;

      overflow-x: hidden;
    }

    .page-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background:
        radial-gradient(
          ellipse at 75% 35%,
          rgba(75, 95, 125, 0.12),
          transparent 35%
        ),
        radial-gradient(
          ellipse at 25% 70%,
          rgba(55, 65, 85, 0.08),
          transparent 40%
        );
    }

   .movie-page {
  width: 100%;
  min-height: 100vh;

  margin: 0;
  padding: 70px 7%;

  background: rgba(25, 28, 35, 0.35);

  border: none;
  border-radius: 0;

  box-shadow: none;

  backdrop-filter: blur(4px);
}

  .movie-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 430px;
  gap: 70px;
  align-items: center;

  min-height: calc(100vh - 140px);
}
    .poster-area {
  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 640px;
}
   .poster-reflection {
  position: absolute;

  width: 120%;
  height: 180px;

  left: -10%;
  bottom: -70px;

  background: rgba(90, 120, 180, 0.38);

  filter: blur(90px);

  border-radius: 50%;

  z-index: 0;
}

   .poster {
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: 430px;
  height: 640px;

  object-fit: cover;

  border-radius: 10px;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.35);
}

    .poster-reflection {
      position: absolute;

      width: 70%;
      height: 100px;

      left: 15%;
      bottom: -25px;

      background: rgba(70, 100, 150, 0.18);

      filter: blur(45px);
      border-radius: 50%;

      z-index: 0;
    }

    .movie-info {
      padding-top: 10px;
    }

    .movie-meta {
      color: #969ba5;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .movie-title {
      margin: 0 0 25px;
      font-size: 48px;
      line-height: 1.05;
      font-weight: 700;
    }

    .movie-description {
      color: #c8cbd1;
      font-size: 17px;
      line-height: 1.7;
      max-width: 700px;
    }

    .movie-rating {
      margin-top: 30px;
      font-size: 18px;
    }

    .stars {
      color: #d8dbe0;
      letter-spacing: 3px;
    }

    .movie-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .movie-actions button,
    .movie-actions a {
      padding: 11px 18px;
      border-radius: 8px;
      border: none;
      text-decoration: none;
      cursor: pointer;
      color: white;
      background: #303640;
    }

    .movie-actions button {
      background: #4a6cf7;
    }

    .movie-links {
      display: flex;
      gap: 20px;
      margin-top: 18px;
    }

    .movie-links a {
      color: #cbd1dc;
      text-decoration: none;
    }

    .movie-links a:hover {
      color: white;
    }

    @media (max-width: 800px) {
      .movie-page {
        width: calc(100% - 20px);
        margin: 20px auto;
        padding: 25px;
      }

      .movie-layout {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .movie-title {
        font-size: 36px;
      }

      .poster {
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <div class="page-background"></div>

  <main class="movie-page">

    <div class="movie-layout">

      <section class="movie-info">

        <div class="movie-meta">
          2014 · Фантастика
        </div>

        <h1 class="movie-title">
          Интерстеллар
        </h1>

        <p class="movie-description">
          В недалёком будущем Земля становится непригодной
          для жизни, и группа исследователей отправляется
          через космический портал на поиски нового дома
          для человечества.
        </p>

        <div class="movie-rating">
          <span class="stars">★★★★★★★★★☆</span>
          <span>8.7 / 10</span>
        </div>

        <div class="movie-actions">
          <button>
            Добавить в мою картотеку
          </button>
        </div>

        <div class="movie-links">
          <a href="#">
            ▶ Трейлер
          </a>

          <a href="#">
            Смотреть фильм
          </a>
        </div>

      </section>


      <section class="poster-area">

        <div class="poster-glow"></div>

        <img
          class="poster"
          src="https://placehold.co/360x530/18202c/ffffff?text=POSTER"
          alt="Постер фильма"
        >

        <div class="poster-reflection"></div>

      </section>

    </div>

  </main>

</body>
</html>
