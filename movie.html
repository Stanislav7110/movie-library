<!DOCTYPE html>
<html lang="ru">
<head>

  <link
    rel="stylesheet"
    href="background.css"
  >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Фильм — Моя Кинотека</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #f2f3f5;
      font-family: Arial, sans-serif;
      background: #080a0e;
      overflow-x: hidden;
    }

    /* Общий фон страницы */

    .page-background {
      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 0;

      background:
        radial-gradient(
          ellipse at 50% 35%,
          rgba(32, 42, 60, 0.22),
          transparent 55%
        ),
        radial-gradient(
          ellipse at 15% 75%,
          rgba(25, 32, 48, 0.16),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 85% 65%,
          rgba(28, 36, 52, 0.16),
          transparent 45%
        );
    }

    /* Фоновый трейлер */

    .trailer-background {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 58vh;

      z-index: 1;

      pointer-events: none;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 20%,
          rgba(35, 48, 70, 0.32),
          rgba(15, 19, 27, 0.15) 45%,
          transparent 75%
        );
    }

    /* Само видео */

    .trailer-video {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0.45;

      filter: brightness(0.55);

      z-index: 0;
    }

    /* Затемнение видео */

    .trailer-overlay {
      position: absolute;

      inset: 0;

      z-index: 1;

      background:
        linear-gradient(
          to bottom,
          rgba(5, 7, 10, 0.15) 0%,
          rgba(5, 7, 10, 0.40) 45%,
          #080a0e 100%
        );
    }

    /* Основная страница */

    .movie-page {
      position: relative;

      z-index: 2;

      width: 100%;
      min-height: 100vh;

      margin: 0;
      padding: 70px 7%;

      background: rgba(8, 10, 14, 0.28);

      border: none;
      border-radius: 0;

      box-shadow: none;

      backdrop-filter: blur(3px);
    }

    /* Основная компоновка */

    .movie-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        430px;

      gap: 70px;

      align-items: center;

      min-height: calc(100vh - 140px);
    }

    /* Информация */

    .movie-info {
      padding-top: 10px;
    }

    .movie-meta {
      color: #8f96a3;

      font-size: 15px;

      margin-bottom: 14px;
    }

    .movie-title {
      margin: 0 0 25px;

      font-size: 48px;

      line-height: 1.05;

      font-weight: 700;
    }

    .movie-description {
      color: #c2c6ce;

      font-size: 17px;

      line-height: 1.7;

      max-width: 700px;
    }

    /* Рейтинг */

    .movie-rating {
      margin-top: 30px;

      font-size: 18px;
    }

    .stars {
      color: #c5c9d0;

      letter-spacing: 3px;

      margin-right: 8px;
    }

    /* Кнопка */

    .movie-actions {
      display: flex;

      gap: 12px;

      flex-wrap: wrap;

      margin-top: 25px;
    }

    .movie-actions button {
      padding: 11px 18px;

      border-radius: 8px;

      border: none;

      cursor: pointer;

      color: white;

      background: #4a6cf7;
    }

    /* Ссылки */

    .movie-links {
      display: flex;

      gap: 20px;

      margin-top: 18px;
    }

    .movie-links a {
      color: #bfc5cf;

      text-decoration: none;
    }

    .movie-links a:hover {
      color: white;
    }

    /* Область постера */

    .poster-area {
      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 640px;
    }

    /* Большое тёмное цветное свечение */

    .poster-glow {
      position: absolute;

      width: 150%;

      height: 105%;

      top: -2%;

      left: -25%;

      background:
        radial-gradient(
          ellipse,
          rgba(45, 65, 100, 0.55) 0%,
          rgba(30, 45, 72, 0.38) 28%,
          rgba(18, 27, 43, 0.20) 50%,
          transparent 75%
        );

      filter: blur(100px);

      border-radius: 50%;

      z-index: 0;
    }

    /* Сам постер */

    .poster {
      position: relative;

      z-index: 2;

      width: 100%;

      max-width: 430px;

      height: 640px;

      object-fit: cover;

      border-radius: 10px;

      box-shadow:
        0 25px 65px rgba(0, 0, 0, 0.55);
    }

    /* Рассеянное свечение под постером */

    .poster-reflection {
      position: absolute;

      width: 125%;

      height: 160px;

      left: -12.5%;

      bottom: -65px;

      background:
        radial-gradient(
          ellipse,
          rgba(40, 60, 95, 0.42),
          rgba(20, 30, 48, 0.18) 45%,
          transparent 72%
        );

      filter: blur(75px);

      border-radius: 50%;

      z-index: 0;
    }

    /* Телефон */

    @media (max-width: 800px) {

      .movie-page {
        width: 100%;

        margin: 0;

        padding: 30px 20px;
      }

      .movie-layout {
        grid-template-columns: 1fr;

        gap: 35px;

        min-height: auto;
      }

      .movie-title {
        font-size: 36px;
      }

      .poster-area {
        min-height: 500px;
      }

      .poster {
        max-width: 320px;

        height: 480px;
      }

      .trailer-background {
        height: 55vh;
      }
    }
  </style>
</head>

<body>

  <!-- Фоновый трейлер -->

  <div class="trailer-background">

    <video
      class="trailer-video"
      autoplay
      muted
      loop
      playsinline
    >
      <source
        src=""
        type="video/mp4"
      >
    </video>

    <div class="trailer-overlay"></div>

  </div>


  <!-- Общий фон -->

  <div class="page-background"></div>


  <!-- Страница фильма -->

  <main class="movie-page">

    <div class="movie-layout">


      <!-- Информация о фильме -->

      <section class="movie-info">

        <div class="movie-meta"></div>

<h1 class="movie-title"></h1>

<p class="movie-description"></p>


        <div class="movie-rating">

          <span class="stars">
            ★★★★★★★★★☆
          </span>

          <span>
            8.7 / 10
          </span>

        </div>


        <div class="movie-actions">

          <button>
            Добавить в мою картотеку
          </button>

        </div>


        <div class="movie-links">

          <a href="#">
            ▶ Трейлер
          </a>

          <a href="#">
            Смотреть фильм
          </a>

        </div>

      </section>


      <!-- Постер -->

      <section class="poster-area">

        <div class="poster-glow"></div>

        <img
          class="poster"
         src=""
          alt="Постер фильма"
        >

        <div class="poster-reflection"></div>

      </section>


    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL =
    "https://kfhlvfymyyqgtsamgcra.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_GKFUCUwNTj4m-FRGL2Pm2g_i1DI1xkk";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  async function loadMovie() {

    const params =
      new URLSearchParams(window.location.search);

    const movieId =
      params.get("id");

    if (!movieId) {
      return;
    }

    const { data: movie, error } =
      await supabaseClient
        .from("movies")
        .select("*")
        .eq("id", movieId)
        .single();

    if (error) {
      console.error(error);
      return;
    }

    document.title =
      movie.title + " — Моя Кинотека";

    document.querySelector(".movie-meta").textContent =
      `${movie.year} · ${movie.type}`;

    document.querySelector(".movie-title").textContent =
      movie.title;

    document.querySelector(".movie-description").textContent =
      movie.description || "Описание отсутствует.";

    document.querySelector(".poster").src =
      movie.poster_url || "";

    document.querySelector(".poster").alt =
      movie.title;

    if (movie.trailer_url) {
      document.querySelector(".movie-links a").href =
        movie.trailer_url;
    }
  }

   loadMovie();

  const addToLibraryBtn =
    document.querySelector(".movie-actions button");

  if (addToLibraryBtn) {
    addToLibraryBtn.addEventListener("click", async () => {

      const { data: sessionData } =
        await supabaseClient.auth.getSession();

      if (!sessionData.session) {
        alert("Сначала войдите в аккаунт.");
        return;
      }

      const userId =
        sessionData.session.user.id;

      const params =
        new URLSearchParams(window.location.search);

      const movieId =
        params.get("id");

      if (!movieId) {
        return;
      }

      const { error } =
        await supabaseClient
          .from("user_movies")
          .insert({
            user_id: userId,
            movie_id: Number(movieId)
          });

      if (error) {

        if (error.code === "23505") {
          addToLibraryBtn.textContent =
            "Уже в моей картотеке";
        } else {
          console.error(error);
          alert("Не удалось добавить фильм.");
        }

        return;
      }

      addToLibraryBtn.textContent =
        "Добавлено в картотеку";
    });
  }
</script>

</body>
</html>
