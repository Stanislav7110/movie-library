<!DOCTYPE html>
<html lang="ru">
<head>

  <link rel="stylesheet" href="background.css">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Фильм — Моя Кинотека</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #f2f3f5;
      font-family: Arial, sans-serif;
      background: #080a0e;
      overflow-x: hidden;
    }

    /* ================================
       ФОНОВЫЙ ТРЕЙЛЕР
       ================================ */

    .trailer-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 58vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 20%,
          rgba(35, 48, 70, 0.32),
          rgba(15, 19, 27, 0.15) 45%,
          transparent 75%
        );
    }

    .trailer-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      filter: brightness(0.55);
      z-index: 0;
      border: none;
    }

    .trailer-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;

      background:
        linear-gradient(
          to bottom,
          rgba(5, 7, 10, 0.15) 0%,
          rgba(5, 7, 10, 0.40) 45%,
          #080a0e 100%
        );
    }

    /* ================================
       СТРАНИЦА ФИЛЬМА
       ================================ */

    .movie-page {
      position: relative;
      z-index: 2;

      width: 100%;
      min-height: 100vh;

      margin: 0;
      padding: 70px 7%;

      background: rgba(8, 10, 14, 0.28);

      border: none;
      border-radius: 0;
      box-shadow: none;

      backdrop-filter: blur(3px);
    }

    .movie-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        430px;

      gap: 70px;

      align-items: center;

      min-height: calc(100vh - 140px);
    }

    /* ================================
       ИНФОРМАЦИЯ
       ================================ */

    .movie-info {
      padding-top: 10px;
    }

    .movie-meta {
      color: #8f96a3;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .movie-title {
      margin: 0 0 25px;
      font-size: 48px;
      line-height: 1.05;
      font-weight: 700;
    }

    .movie-description {
      color: #c2c6ce;
      font-size: 17px;
      line-height: 1.7;
      max-width: 700px;
    }

    /* ================================
       РЕЙТИНГ
       ================================ */

    .movie-rating {
      margin-top: 30px;
      font-size: 18px;
    }

    .stars {
      color: #c5c9d0;
      letter-spacing: 3px;
      margin-right: 8px;
    }

    /* ================================
       КНОПКА
       ================================ */

    .movie-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .movie-actions button {
      padding: 11px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      color: white;
      background: #4a6cf7;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }

    .movie-actions button:hover {
      opacity: 0.88;
    }

    .movie-actions button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    /* ================================
       ССЫЛКИ
       ================================ */

    .movie-links {
      display: flex;
      gap: 20px;
      margin-top: 18px;
    }

    .movie-links a {
      color: #bfc5cf;
      text-decoration: none;
    }

    .movie-links a:hover {
      color: white;
    }

    /* ================================
       ПОСТЕР
       ================================ */

    .poster-area {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 640px;
    }

    .poster-glow {
      position: absolute;

      width: 108%;
      height: 108%;

      top: -4%;
      left: -4%;

      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 98%,
          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.75
          ) 0%,

          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.42
          ) 12%,

          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.18
          ) 28%,

          transparent 48%
        ),

        radial-gradient(
          ellipse at 2% 50%,
          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.55
          ) 0%,

          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.18
          ) 15%,

          transparent 32%
        ),

        radial-gradient(
          ellipse at 98% 50%,
          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.55
          ) 0%,

          rgba(
            var(--poster-r, 80),
            var(--poster-g, 100),
            var(--poster-b, 180),
            0.18
          ) 15%,

          transparent 32%
        );

      filter: blur(28px);
    }

    .poster-area::after {
      content: "";

      position: absolute;

      width: 101%;
      height: 101%;

      top: -0.5%;
      left: -0.5%;

      z-index: 0;
      pointer-events: none;

      border-radius: 13px;

      box-shadow:
        0 12px 22px rgba(80, 90, 210, 0.75),
        0 25px 45px rgba(65, 75, 180, 0.48),
        -10px 4px 24px rgba(75, 85, 195, 0.42),
        10px 4px 24px rgba(75, 85, 195, 0.42);

      filter: blur(7px);
    }

    .poster-reflection {
      position: absolute;

      width: 110%;
      height: 120px;

      left: -5%;
      bottom: -45px;

      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(80, 90, 190, 0.48) 0%,
          rgba(65, 75, 165, 0.24) 35%,
          transparent 72%
        );

      filter: blur(32px);

      border-radius: 50%;
    }

    .poster {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 430px;
      height: 640px;

      object-fit: cover;

      border-radius: 10px;

      box-shadow:
        0 25px 65px rgba(0, 0, 0, 0.55);
    }

    /* ================================
       ТЕЛЕФОН
       ================================ */

    @media (max-width: 800px) {

      .movie-page {
        width: 100%;
        margin: 0;
        padding: 30px 20px;
      }

      .movie-layout {
        grid-template-columns: 1fr;
        gap: 35px;
        min-height: auto;
      }

      .movie-title {
        font-size: 36px;
      }

      .poster-area {
        min-height: 500px;
      }

      .poster {
        max-width: 320px;
        height: 480px;
      }

      .trailer-background {
        height: 55vh;
      }

    }

  </style>

</head>

<body>

  <!-- ================================
       ФОНОВЫЙ ТРЕЙЛЕР
       ================================ -->

  <div class="trailer-background">

    <iframe
      id="trailerBackground"
      class="trailer-video"
      src=""
      frameborder="0"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>

    <div class="trailer-overlay"></div>

  </div>

  <!-- Общий фон -->

  <div class="page-background"></div>

  <!-- ================================
       СТРАНИЦА ФИЛЬМА
       ================================ -->

  <main class="movie-page">

    <div class="movie-layout">

      <!-- Информация -->

      <section class="movie-info">

        <div class="movie-meta"></div>

        <h1 class="movie-title"></h1>

        <p class="movie-description"></p>

        <div class="movie-rating">

          <span class="stars">
            ★★★★★★★★★☆
          </span>

          <span>
            8.7 / 10
          </span>

        </div>

        <div class="movie-actions">

          <button id="addToLibraryBtn">
            Добавить в мою картотеку
          </button>

        </div>

        <div class="movie-links">

          <a
            id="trailerLink"
            href="#"
          >
            ▶ Трейлер
          </a>

          <a
            id="watchLink"
            href="#"
          >
            Смотреть фильм
          </a>

        </div>

      </section>

      <!-- Постер -->

      <section class="poster-area">

        <div class="poster-glow"></div>

        <img
          class="poster"
          src=""
          alt="Постер фильма"
        >

        <div class="poster-reflection"></div>

      </section>

    </div>

  </main>


  <!-- ================================
       SUPABASE
       ================================ -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://kfhlvfymyyqgtsamgcra.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_GKFUCUwNTj4m-FRGL2Pm2g_i1DI1xkk";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =================================
       ПОЛУЧАЕМ ПАРАМЕТРЫ
       ================================= */

    const pageParams =
      new URLSearchParams(
        window.location.search
      );

    const localMovieId =
      pageParams.get("id");

    const tmdbData =
      pageParams.get("tmdb");


    /* =================================
       ЭЛЕМЕНТЫ СТРАНИЦЫ
       ================================= */

    const movieMeta =
      document.querySelector(".movie-meta");

    const movieTitle =
      document.querySelector(".movie-title");

    const movieDescription =
      document.querySelector(".movie-description");

    const poster =
      document.querySelector(".poster");

    const trailerBackground =
      document.getElementById(
        "trailerBackground"
      );

    const trailerLink =
      document.getElementById(
        "trailerLink"
      );

    const watchLink =
      document.getElementById(
        "watchLink"
      );

    const addToLibraryBtn =
      document.getElementById(
        "addToLibraryBtn"
      );


    /* =================================
       ПОКАЗ ОШИБКИ
       ================================= */

    function showPageError(message) {

      if (movieTitle) {
        movieTitle.textContent =
          "Не удалось загрузить фильм";
      }

      if (movieDescription) {
        movieDescription.textContent =
          message;
      }

      console.error(message);

    }


    /* =================================
       ОПРЕДЕЛЕНИЕ ЦВЕТА ПОСТЕРА
       ================================= */

    function setPosterColor() {

      if (!poster) {
        return;
      }

      try {

        const canvas =
          document.createElement("canvas");

        const ctx =
          canvas.getContext("2d");

        canvas.width = 50;
        canvas.height = 50;

        ctx.drawImage(
          poster,
          0,
          0,
          50,
          50
        );

        const imageData =
          ctx.getImageData(
            0,
            0,
            50,
            50
          ).data;

        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;

        for (
          let i = 0;
          i < imageData.length;
          i += 4
        ) {

          const red =
            imageData[i];

          const green =
            imageData[i + 1];

          const blue =
            imageData[i + 2];

          const brightness =
            (red + green + blue) / 3;

          if (brightness > 25) {

            r += red;
            g += green;
            b += blue;

            count++;

          }

        }

        if (!count) {
          return;
        }

        r =
          Math.round(r / count);

        g =
          Math.round(g / count);

        b =
          Math.round(b / count);

        document.documentElement.style.setProperty(
          "--poster-r",
          r
        );

        document.documentElement.style.setProperty(
          "--poster-g",
          g
        );

        document.documentElement.style.setProperty(
          "--poster-b",
          b
        );

      } catch (error) {

        console.error(
          "Ошибка определения цвета постера:",
          error
        );

      }

    }


    /* =================================
       YOUTUBE ID
       ================================= */

    function getYoutubeId(urlString) {

      if (!urlString) {
        return null;
      }

      try {

        const url =
          new URL(urlString);

        if (
          url.hostname.includes(
            "youtube.com"
          )
        ) {

          return url.searchParams.get("v");

        }

        if (
          url.hostname ===
          "youtu.be"
        ) {

          return url.pathname
            .replace("/", "")
            .trim();

        }

      } catch (error) {

        console.error(
          "Ошибка разбора YouTube:",
          error
        );

      }

      return null;

    }


    /* =================================
       ПОКАЗ ФИЛЬМА
       ================================= */

    function showMovie(movie) {

      if (!movie) {
        showPageError(
          "Данные фильма отсутствуют."
        );
        return;
      }


      /* Заголовок */

      document.title =
        (movie.title || "Фильм") +
        " — Моя Кинотека";


      /* Метаданные */

      if (movieMeta) {

        const parts = [];

        if (movie.year) {
          parts.push(movie.year);
        }

        if (movie.type) {
          parts.push(movie.type);
        }

        movieMeta.textContent =
          parts.join(" · ");

      }


      /* Название */

      if (movieTitle) {

        movieTitle.textContent =
          movie.title ||
          "Без названия";

      }


      /* Описание */

      if (movieDescription) {

        movieDescription.textContent =
          movie.description ||
          "Описание отсутствует.";

      }


      /* Постер */

      if (poster) {

        poster.src =
          movie.poster_url || "";

        poster.alt =
          movie.title ||
          "Постер фильма";

        poster.onload =
          setPosterColor;

      }


      /* =================================
         ТРЕЙЛЕР
         ================================= */

      const trailerUrl =
        movie.trailer_url ||
        movie.trailer_auto_url ||
        null;

      if (trailerUrl) {

        const youtubeId =
          getYoutubeId(trailerUrl);

        if (
          trailerBackground &&
          youtubeId
        ) {

          trailerBackground.src =
            "https://www.youtube.com/embed/" +
            youtubeId +
            "?autoplay=1" +
            "&mute=1" +
            "&loop=1" +
            "&playlist=" +
            youtubeId +
            "&controls=0" +
            "&showinfo=0" +
            "&rel=0";

        }

        if (trailerLink) {

          trailerLink.href =
            trailerUrl;

          trailerLink.target =
            "_blank";

          trailerLink.rel =
            "noopener noreferrer";

          trailerLink.style.display =
            "inline";

        }

      } else {

        if (trailerLink) {
          trailerLink.style.display =
            "none";
        }

      }


      /* =================================
         ПРОСМОТР ФИЛЬМА
         ================================= */

      const watchUrl =
        movie.watch_url ||
        movie.watch_auto_url ||
        null;

      if (watchLink) {

        if (watchUrl) {

          watchLink.href =
            watchUrl;

          watchLink.target =
            "_blank";

          watchLink.rel =
            "noopener noreferrer";

          watchLink.textContent =
            "Смотреть фильм";

          watchLink.style.display =
            "inline";

        } else if (
          movie.tmdb_id ||
          (
            movie.id &&
            tmdbData
          )
        ) {

          const tmdbId =
            movie.tmdb_id ||
            movie.id;

          watchLink.href =
            `https://www.themoviedb.org/movie/${tmdbId}/watch`;

          watchLink.target =
            "_blank";

          watchLink.rel =
            "noopener noreferrer";

          watchLink.textContent =
            "Смотреть фильм";

          watchLink.style.display =
            "inline";

        } else {

          watchLink.style.display =
            "none";

        }

      }

    }


    /* =================================
       ЗАГРУЗКА ФИЛЬМА ИЗ БАЗЫ
       ================================= */

    async function loadLocalMovie() {

      if (!localMovieId) {
        return null;
      }

      const {
        data: movie,
        error
      } =
        await supabaseClient
          .from("movies")
          .select("*")
          .eq("id", localMovieId)
          .single();

      if (error) {

        console.error(
          "Ошибка загрузки фильма:",
          error
        );

        showPageError(
          "Не удалось загрузить фильм из Кинотеки."
        );

        return null;

      }

      if (!movie) {

        showPageError(
          "Фильм не найден."
        );

        return null;

      }

      showMovie(movie);

      return movie;

    }


    /* =================================
       ЗАГРУЗКА ФИЛЬМА ИЗ TMDB
       ================================= */

    async function loadTmdbMovie() {

      if (!tmdbData) {
        return null;
      }

      let movie;

      try {

        movie =
          JSON.parse(
            decodeURIComponent(
              tmdbData
            )
          );

      } catch (error) {

        console.error(
          "Ошибка чтения данных TMDB:",
          error
        );

        showPageError(
          "Не удалось прочитать данные фильма."
        );

        return null;

      }


      /* Сначала показываем то,
         что уже пришло из поиска */

      showMovie(movie);


      if (!movie.id) {

        console.error(
          "У фильма нет TMDB ID."
        );

        return movie;

      }


      /* Получаем полную информацию */

      try {

        const {
          data: result,
          error
        } =
          await supabaseClient.functions.invoke(
            "tmdb-movie",
            {
              body: {
                movie_id: movie.id
              }
            }
          );


        if (error) {

          console.error(
            "Ошибка функции tmdb-movie:",
            error
          );

          return movie;

        }


        if (!result) {

          console.error(
            "tmdb-movie не вернула данные."
          );

          return movie;

        }


        console.log(
          "Данные TMDB:",
          result
        );


        const fullMovie =
          result.movie;


        if (!fullMovie) {

          console.error(
            "В ответе нет данных фильма."
          );

          return movie;

        }


        let trailerAutoUrl =
          null;

        if (
          result.trailer &&
          result.trailer.youtube_url
        ) {

          trailerAutoUrl =
            result.trailer.youtube_url;

        }


        let watchAutoUrl =
          null;

        if (
          result.watch &&
          result.watch.link
        ) {

          watchAutoUrl =
            result.watch.link;

        }


        const updatedMovie = {

          ...movie,

          title:
            fullMovie.title ||
            movie.title,

          year:
            fullMovie.release_date
              ? fullMovie.release_date.substring(
                  0,
                  4
                )
              : movie.year,

          description:
            fullMovie.overview ||
            movie.description,

          poster_url:
            fullMovie.poster_path
              ? "https://image.tmdb.org/t/p/w500" +
                fullMovie.poster_path
              : movie.poster_url,

          trailer_auto_url:
            trailerAutoUrl,

          watch_auto_url:
            watchAutoUrl

        };


        showMovie(
          updatedMovie
        );


        console.log(
          "Автоматический трейлер:",
          trailerAutoUrl
        );

        console.log(
          "Автоматическая ссылка просмотра:",
          watchAutoUrl
        );


        return updatedMovie;

      } catch (error) {

        console.error(
          "Ошибка загрузки TMDB:",
          error
        );

        return movie;

      }

    }


    /* =================================
       ЗАГРУЗКА СТРАНИЦЫ
       ================================= */

    async function loadMovie() {

      if (localMovieId) {

        await loadLocalMovie();

        return;

      }


      if (tmdbData) {

        await loadTmdbMovie();

        return;

      }


      showPageError(
        "Фильм не указан."
      );

    }


    /* =================================
       ДОБАВЛЕНИЕ В МОЮ КАРТОТЕКУ
       ================================= */

    if (addToLibraryBtn) {

      addToLibraryBtn.addEventListener(
        "click",
        async function () {

          /* Не даём нажать несколько раз */

          addToLibraryBtn.disabled = true;

          const originalText =
            addToLibraryBtn.textContent;


          try {

            /* =================================
               ПРОВЕРЯЕМ АВТОРИЗАЦИЮ
               ================================= */

            const {
              data: sessionData,
              error: sessionError
            } =
              await supabaseClient.auth.getSession();


            if (sessionError) {

              console.error(
                "Ошибка проверки авторизации:",
                sessionError
              );

              alert(
                "Не удалось проверить авторизацию."
              );

              return;

            }


            if (
              !sessionData ||
              !sessionData.session
            ) {

              alert(
                "Сначала войдите в аккаунт."
              );

              return;

            }


            const userId =
              sessionData.session.user.id;


            /* =================================
               ОБЫЧНЫЙ ФИЛЬМ ИЗ НАШЕЙ БАЗЫ
               ================================= */

            if (localMovieId) {

              const {
                error: libraryError
              } =
                await supabaseClient
                  .from("user_movies")
                  .insert({

                    user_id:
                      userId,

                    movie_id:
                      Number(localMovieId)

                  });


              if (libraryError) {

                if (
                  libraryError.code ===
                  "23505"
                ) {

                  addToLibraryBtn.textContent =
                    "Уже в моей картотеке";

                  return;

                }


                console.error(
                  "Ошибка добавления:",
                  libraryError
                );

                alert(
                  "Не удалось добавить фильм."
                );

                return;

              }


              addToLibraryBtn.textContent =
                "Добавлено в картотеку";

              return;

            }


            /* =================================
               ФИЛЬМ ИЗ TMDB
               ================================= */

            if (tmdbData) {

              let tmdbMovie;

              try {

                tmdbMovie =
                  JSON.parse(
                    decodeURIComponent(
                      tmdbData
                    )
                  );

              } catch (error) {

                console.error(
                  "Ошибка чтения TMDB:",
                  error
                );

                alert(
                  "Не удалось получить данные фильма."
                );

                return;

              }


              if (!tmdbMovie.id) {

                alert(
                  "У этого фильма отсутствует TMDB ID."
                );

                return;

              }


              /* =================================
                 ИЩЕМ ФИЛЬМ В НАШЕЙ БАЗЕ
                 ================================= */

              let movieInDatabase =
                null;


              const {
                data: existingMovies,
                error: searchError
              } =
                await supabaseClient
                  .from("movies")
                  .select("*")
                  .eq(
                    "tmdb_id",
                    tmdbMovie.id
                  )
                  .limit(1);


              if (searchError) {

                console.error(
                  "Ошибка поиска фильма:",
                  searchError
                );

                alert(
                  "Не удалось проверить фильм в Кинотеке."
                );

                return;

              }


              if (
                existingMovies &&
                existingMovies.length > 0
              ) {

                movieInDatabase =
                  existingMovies[0];

              }


              /* =================================
                 ЕСЛИ ФИЛЬМА НЕТ — СОЗДАЁМ
                 ================================= */

              if (!movieInDatabase) {

                const {
                  data: newMovie,
                  error: insertMovieError
                } =
                  await supabaseClient
                    .from("movies")
                    .insert({

                      title:
                        tmdbMovie.title ||
                        "Без названия",

                      year:
                        tmdbMovie.year ||
                        null,

                      description:
                        tmdbMovie.description ||
                        "",

                      poster_url:
                        tmdbMovie.poster_url ||
                        "",

                      type:
                        tmdbMovie.type ||
                        "Фильм",

                      tmdb_id:
                        tmdbMovie.id

                    })
                    .select()
                    .single();


                if (insertMovieError) {

                  console.error(
                    "Ошибка создания фильма:",
                    insertMovieError
                  );

                  alert(
                    "Не удалось добавить фильм в Кинотеку."
                  );

                  return;

                }


                movieInDatabase =
                  newMovie;

              }


              /* =================================
                 ДОБАВЛЯЕМ ФИЛЬМ ПОЛЬЗОВАТЕЛЮ
                 ================================= */

              const {
                error: libraryError
              } =
                await supabaseClient
                  .from("user_movies")
                  .insert({

                    user_id:
                      userId,

                    movie_id:
                      movieInDatabase.id

                  });


              if (libraryError) {

                if (
                  libraryError.code ===
                  "23505"
                ) {

                  addToLibraryBtn.textContent =
                    "Уже в моей картотеке";

                  return;

                }


                console.error(
                  "Ошибка добавления в картотеку:",
                  libraryError
                );

                alert(
                  "Не удалось добавить фильм в картотеку."
                );

                return;

              }


              addToLibraryBtn.textContent =
                "Добавлено в картотеку";

              return;

            }


            alert(
              "Не удалось определить фильм."
            );

          } catch (error) {

            console.error(
              "Неожиданная ошибка:",
              error
            );

            alert(
              "Произошла ошибка. Посмотрите консоль браузера."
            );

          } finally {

            /*
             * Если фильм успешно добавлен
             * или уже находится в картотеке,
             * кнопку оставляем отключённой.
             */

            if (
              addToLibraryBtn.textContent ===
                "Добавлено в картотеку" ||
              addToLibraryBtn.textContent ===
                "Уже в моей картотеке"
            ) {

              addToLibraryBtn.disabled =
                true;

            } else {

              addToLibraryBtn.disabled =
                false;

              addToLibraryBtn.textContent =
                originalText;

            }

          }

        }
      );

    }


    /* =================================
       ЗАПУСК
       ================================= */

    loadMovie();

  </script>

</body>
</html>
